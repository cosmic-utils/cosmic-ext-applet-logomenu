[package]
name = "cosmic-ext-logomenu-settings"
version = "0.8.0"
edition = "2024"
license = "GPL-3.0"
description = "Settings application for COSMIC Logo Menu applet"
repository = "https://github.com/cappsyco/cosmic-ext-applet-logomenu"

[dependencies]
serde = "1.0.229"
liblog = { path = "../liblog" }
rfd = "0.17.2"
sysinfo = "0.40.0"
open = "5.4.5"

[dependencies.i18n-embed]
version = "0.16.0"
features = ["desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    "a11y",
    "about",
    "multi-window",
    "single-instance",
    "winit",
    "wayland",
    "wgpu",
    "tokio"
]

[features]
default = ["xdg-portal"]
xdg-portal = ["libcosmic/xdg-portal"]
flatpak = []
